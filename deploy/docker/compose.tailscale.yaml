# Running Companion on a free https://<name>.<tailnet>.ts.net address through Tailscale Funnel. Nothing to open on
# the server and no domain to buy: the same setup as `npm run up`, in containers.
#
# Before starting:
#   1. In the Tailscale admin console, create an auth key (Settings → Keys) and allow Funnel for the tailnet
#      (Access controls: the "funnel" node attribute). See README.md.
#   2. Set TS_AUTHKEY, TS_HOSTNAME and PUBLIC_URL in .env (see .env.example).
#
#   docker compose -f compose.tailscale.yaml up -d
#   docker compose -f compose.tailscale.yaml logs app     ← the setup link, on first start

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-companion}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-companion}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: no extra privileges or /dev/net/tun needed.
      TS_USERSPACE: 'true'
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro

  app:
    image: ghcr.io/dtsiakas/running-companion:${COMPANION_TAG:-latest}
    restart: unless-stopped
    init: true
    # Share the Tailscale container's network: Funnel reaches the app on 127.0.0.1, and nothing else can.
    network_mode: service:tailscale
    env_file: { path: .env, required: false }
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env, e.g. https://companion.your-tailnet.ts.net}
      HOST: 127.0.0.1
      TRUST_PROXY: 'true'
      TZ: ${TZ:-UTC}
    volumes:
      - data:/data
    depends_on: [tailscale]

volumes:
  data:
  tailscale-state:
