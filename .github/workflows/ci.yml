name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    # The Windows side (installer, paths, processes) is tested by desktop.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The same as npm test, also writing a TAP file for the step below.
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=test.tap "packages/*/test/*.test.ts"
      # On failure, each failing test with its message as an annotation, readable on the run page without the log.
      - name: Failed tests
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          { grep -E -A14 '^\s*not ok' test.tap || true; } | grep -vE '^\s*(---|\.\.\.)$' | tr '\n' ' ' | sed 's/ -- /\n/g' | head -20 | while read -r line; do echo "::error::${line:0:900}"; done
          echo "::notice::$(grep -E '^# (tests|pass|fail|cancelled)' test.tap | tr '\n' ' ')"
          echo "::notice::$(tail -c 800 test.tap | tr '\n' ' ')"
      - run: npm run build
