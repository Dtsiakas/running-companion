name: CodeQL

# GitHub's code scanning for the TypeScript: injection, unsafe redirects, weak crypto and the like. Findings appear
# under the repository's Security tab.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
      # The same findings as a file, for reading them without the Security tab (forks, scripts).
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 14
