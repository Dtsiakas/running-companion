name: Remove from the MCP Registry

# One-off: marks every published version as deleted in the official MCP Registry.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher status --status deleted --all-versions --message "Personal project, not offered for public use." io.github.Dtsiakas/running-companion
