name: Image scan

# Weekly: known vulnerabilities in the published image (mostly the Debian and Node base it's built on). Findings appear
# under the Security tab; a fixed base image arrives through Dependabot's Docker updates and the next build.

on:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned by commit: this action's tags have been rewritten before
        with:
          image-ref: ghcr.io/dtsiakas/running-companion:edge  # registry paths are lower case
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: image
