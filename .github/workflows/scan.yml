name: Image scan

# Weekly: known vulnerabilities in the published image (mostly the Debian and Node base it's built on). Findings appear
# under the Security tab; a fixed base image arrives through Dependabot's Docker updates and the next build.

on:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned by commit like any third-party action that sees a registry token
        with:
          image-ref: ghcr.io/dtsiakas/running-companion:edge  # registry paths are lower case
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: image
      - name: Findings
        run: |
          jq -r '.runs[].results[] | "::warning::\(.ruleId) (\(.level)): \(.message.text | split("\n")[0:3] | join(" "))"' trivy.sarif | head -50
          echo "::notice::$(jq '[.runs[].results[]] | length' trivy.sarif) findings"
      - uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif
          path: trivy.sarif
          retention-days: 14
